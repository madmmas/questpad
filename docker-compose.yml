# Local full stack: Postgres + Next.js (pages + API routes / Vercel Functions).
#
#   make up
#   open http://localhost:3000/board
#
# Neon SQL-over-HTTP cannot talk to this Postgres container — the app uses the
# postgres (TCP) driver when DATABASE_DRIVER=postgres (set below).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: questpad
      POSTGRES_PASSWORD: questpad
      POSTGRES_DB: questpad
    ports:
      # Host 5433 avoids clashing with a local Postgres already on 5432.
      - "5433:5432"
    volumes:
      - questpad_pg:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U questpad -d questpad"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://questpad:questpad@db:5432/questpad
      DATABASE_DRIVER: postgres
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-docker-dev-secret
      AUTH_SECRET: local-docker-dev-secret
      DEMO_PARENT_USER: parent
      DEMO_PARENT_PASSWORD: parent123
      DEMO_CHILD_USER: child
      DEMO_CHILD_PASSWORD: child123
      # AI review (#7): local by default in Compose; set claude + ANTHROPIC_API_KEY to use Claude
      AI_REVIEW_PROVIDER: local
      AI_REVIEW_ON_SUBMIT: "0"
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-sonnet-4-20250514
      # Unset Blob token → local uploads/ fallback (src/lib/storage/blob.ts)
      BLOB_READ_WRITE_TOKEN: ""
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
      - questpad_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Opt-in: docker compose --profile demo run --rm seed
  # (or: make demo-seed). Never starts with plain `make up`.
  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ALLOW_DEMO_SEED: "1"
      DATABASE_URL: postgresql://questpad:questpad@db:5432/questpad
      DATABASE_DRIVER: postgres
      NODE_ENV: development
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]

volumes:
  questpad_pg:
  questpad_uploads:
  app_node_modules:
  app_next:
